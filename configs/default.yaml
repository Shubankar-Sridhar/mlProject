api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins:
    - "*"
  rate_limit:
    per_minute: 60
    per_hour: 1000

database:
  pool_size: 10
  max_overflow: 20
  timeout: 30
  read_only: true
  max_rows: 10000

model:
  base_model: Qwen/Qwen2.5-Coder-7B
  quantization: 4bit
  max_length: 4096
  max_tokens: 512
  temperature: 0.1
  top_p: 0.9
  top_k: 50
  n_gpu_layers: -1
  n_threads: 8

training:
  lora_r: 64
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
  batch_size: 4
  gradient_accumulation: 4
  learning_rate: 2e-4
  num_epochs: 3
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  max_grad_norm: 0.3
  weight_decay: 0.001
  max_length: 2048

visualization:
  max_categories: 20
  max_series: 10
  default_theme: default
  chart_types:
    - bar
    - horizontal_bar
    - line
    - area
    - scatter
    - pie
    - donut
    - heatmap

security:
  allowed_operations:
    - SELECT
    - WITH
    - UNION
  forbidden_keywords:
    - INSERT
    - UPDATE
    - DELETE
    - DROP
    - ALTER
    - CREATE
    - TRUNCATE
    - REPLACE
    - GRANT
    - REVOKE
  max_rows: 10000
  timeout: 30

logging:
  level: INFO
  format: json
  output: stdout

monitoring:
  prometheus_enabled: true
  metrics_port: 8000